    <style>
      html, body { min-height: 100%; background: #f5f7fb; }
      html.app-booting:not(.app-returning) body { margin: 0; overflow: hidden; background: #0d123d; }
      html.app-booting:not(.app-returning) body > :not(.app-boot-screen) { visibility: hidden !important; }
      .app-boot-screen { position: fixed; z-index: 9999; inset: 0; display: grid; place-content: center; gap: 18px; padding: 24px; background: radial-gradient(circle at 50% 36%, #243f92 0, #141e61 40%, #0b1038 100%); color: #f8f7f2; text-align: center; transition: opacity .22s ease, visibility .22s ease; }
      .app-boot-mark { display: grid; width: 72px; height: 72px; margin: 0 auto; place-items: center; overflow: hidden; border: 1px solid rgba(146, 194, 255, .34); border-radius: 21px; background: linear-gradient(145deg, #253ec7, #11194c 72%); box-shadow: 0 18px 42px rgba(29, 47, 137, .3); }
      .app-boot-mark svg { display: block; width: 52px; height: 52px; filter: drop-shadow(0 5px 9px rgba(0,0,0,.2)); }
      .app-boot-screen strong { font: 750 18px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .app-boot-screen span:last-child { color: #aebce8; font: 500 12px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .app-boot-pulse { width: 36px; height: 4px; margin: -6px auto 0; overflow: hidden; border-radius: 999px; background: rgba(172,190,244,.22); }
      .app-boot-pulse::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #74d7ff; animation: boot-slide 1s ease-in-out infinite alternate; }
      html.app-returning .app-boot-screen,
      html:not(.app-booting) .app-boot-screen { visibility: hidden; opacity: 0; pointer-events: none; }
      @keyframes boot-slide { to { transform: translateX(122%); } }
    </style>
    <script>
      try {
        if (localStorage.getItem("vocab-app-booted-v1") === "1") document.documentElement.classList.add("app-returning");
      } catch {}
    </script>
    <script>
      (() => {
        if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
        const build = "71";
        const reloadKey = `vocab-sw-reloaded-${build}`;
        const hadController = Boolean(navigator.serviceWorker.controller);
        let refreshing = false;

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController || refreshing) return;
          refreshing = true;
          try {
            if (sessionStorage.getItem(reloadKey) === "1") return;
            sessionStorage.setItem(reloadKey, "1");
          } catch {}
          location.reload();
        });

        const checkForUpdate = () => {
          const registration = window.__vocabServiceWorkerRegistration;
          if (registration) registration.update().catch(() => {});
        };
        window.__vocabCheckForUpdates = checkForUpdate;

        navigator.serviceWorker.register(`./sw.js?v=${build}`, { updateViaCache: "none" })
          .then((registration) => {
            window.__vocabServiceWorkerRegistration = registration;
            if (registration.waiting) registration.waiting.postMessage({ type: "SKIP_WAITING" });
            registration.addEventListener("updatefound", () => {
              const worker = registration.installing;
              if (!worker) return;
              worker.addEventListener("statechange", () => {
                if (worker.state === "installed" && navigator.serviceWorker.controller) {
                  worker.postMessage({ type: "SKIP_WAITING" });
                }
              });
            });
            return registration.update();
          })
          .catch(() => {});

        window.addEventListener("pageshow", checkForUpdate);
        window.addEventListener("online", checkForUpdate);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") checkForUpdate();
        });
      })();
    </script>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      (() => {
        if (!document.documentElement.classList.contains("app-returning")) return;
        try {
          const snapshot = JSON.parse(localStorage.getItem("vocab-warm-shell-v1") || "null");
          if (snapshot && snapshot.hash === location.hash) {
            const app = document.getElementById("app");
            const lesson = document.getElementById("lesson-list");
            const context = document.getElementById("context-rail");
            if (app && snapshot.app) app.innerHTML = snapshot.app;
            if (lesson && snapshot.lesson) lesson.innerHTML = snapshot.lesson;
            if (context && snapshot.context) context.innerHTML = snapshot.context;
            if (snapshot.route) document.body.dataset.route = snapshot.route;
            if (snapshot.corpus) document.body.dataset.corpus = snapshot.corpus;
          }
        } catch {}
        document.documentElement.classList.remove("app-booting");
      })();
    </script>
