<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
 <meta name="theme-color" content="#faf5e9"><meta name="description" content="翻开单词故事，用画面、联想与语境学习 GRE 词汇。">
 <title>单词故事</title><link rel="icon" href="./icon-192-v2.png"><link rel="manifest" href="./manifest.webmanifest">
 <link rel="stylesheet" href="./gre-learning/storybook.css">
</head>
<body>
 <aside id="release-summary" aria-label="词汇学习进度" class="sr-only">词汇学习</aside>
 <a class="skip-link" href="#word-content">跳到学习内容</a>

 <main id="word-content" tabindex="-1" aria-keyshortcuts="ArrowLeft ArrowRight"><p class="initial-status" role="status">正在翻开这一页…</p></main>
 <nav class="bookmarks" aria-label="页边书签"><div class="bookmark-list" id="bookmark-list"><button class="bookmark" id="open-search" type="button" aria-label="打开单词目录，查找单词" aria-controls="word-picker" aria-expanded="false"><span>目录</span></button><a class="bookmark" href="#memory" data-section="memory"><span>记忆</span></a><a class="bookmark" href="#usage" data-section="usage"><span>用法</span></a><a class="bookmark" href="#context-examples" data-section="context-examples"><span>例句</span></a><a class="bookmark" href="#comparison" data-section="comparison"><span>等价词</span></a></div><button class="bookmark-toggle" id="toggle-bookmarks" type="button" aria-controls="bookmark-list" aria-expanded="true" aria-label="收起页边书签"><span>书签</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button></nav>
 <dialog id="word-picker" class="contents-page" aria-labelledby="picker-title" aria-modal="false">
  <div class="contents-sheet">
   <header class="contents-heading"><h1 id="picker-title" tabindex="-1">目录</h1><span class="word-counter sr-only" id="word-counter">— / —</span></header>
   <div class="contents-tools">
    <button class="contents-return" id="close-search" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg><span>继续阅读<span id="contents-return-word" lang="en"></span></span></button>
    <label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="word-search" type="search" placeholder="找一个词或释义" autocomplete="off" aria-label="搜索目录中的英文或中文释义" aria-controls="word-results"></label>
   </div>
   <div class="contents-list-heading"><p id="search-count" class="search-count" aria-live="polite"></p><span class="contents-ordinal-label">词序</span></div>
   <ol id="word-results" class="word-results" aria-label="本册单词，按阅读顺序排列"></ol>
  </div>
 </dialog>
 <div class="update-status" id="update-status" role="status" hidden></div><div id="speech-status" class="sr-only" role="status"></div>
 <script type="module">import('./gre-learning/app.js').catch(()=>{document.getElementById('word-content').innerHTML='<div class="initial-status"><p>这一页暂时无法打开</p><button type="button" onclick="location.reload()">重新打开</button></div>';});</script>
 <script src="./gre-learning/update.js" defer></script>
</body></html>
