    <script>
      try {
        if (!location.hash) {
          const corpus = localStorage.getItem("vocab-last-corpus-v1") === "ielts" ? "ielts" : "gre";
          const key = corpus === "ielts" ? "ielts-538-progress-v2" : "gre-300-progress-v4";
          const stored = JSON.parse(localStorage.getItem(key) || "null");
          const number = Math.max(1, Number(stored?.lastWord || 1));
          history.replaceState(null, "", `#${corpus === "ielts" ? "ielts/" : ""}learn/${number}`);
        }
      } catch {}
    </script>
    <script>
      try {
        const snapshot = JSON.parse(localStorage.getItem("vocab-warm-shell-v1") || "null");
        if (
          snapshot
          && snapshot.hash === location.hash
          && snapshot.app
          && snapshot.lesson
          && snapshot.context
        ) {
          window.__vocabWarmShellSnapshot = snapshot;
          document.documentElement.classList.add("app-returning");
        }
      } catch {}
    </script>
    <script>
      (() => {
        if (!("serviceWorker" in navigator) || location.protocol === "file:" || location.hostname === "app.local") return;
        const build = "94";
        const offlineReadyKey = `vocab-offline-ready-${build}`;
        const hadController = Boolean(navigator.serviceWorker.controller);
        let refreshing = false;
        let progressState = null;
        let hideProgressTimer = 0;
        let appReady = false;
        let cacheReady = false;
        let registrationStarted = false;
        let lastUpdateCheck = 0;

        const paintProgress = () => {
          if (!progressState) return;
          const reportedPercent = Math.max(0, Math.min(100, Number(progressState.percent) || 0));
          const percent = progressState.type === "CACHE_READY" && !appReady
            ? Math.min(96, reportedPercent)
            : reportedPercent;
          document.documentElement.classList.add("offline-cache-active");
          const bootTitle = document.querySelector(".app-boot-screen > strong");
          const bootStatus = document.querySelector(".app-boot-status");
          const bootTrack = document.querySelector(".app-boot-progress");
          const bootFill = bootTrack?.querySelector("span");
          const updateCard = document.querySelector(".offline-cache-progress");
          const updateTitle = updateCard?.querySelector("strong");
          const updateOutput = updateCard?.querySelector("output");
          const updateTrack = updateCard?.querySelector("[role='progressbar']");
          const updateFill = updateTrack?.querySelector("b");
          const updateStatus = updateCard?.querySelector("small");
          const ready = progressState.type === "CACHE_READY";
          const failed = progressState.type === "CACHE_ERROR";
          const fullyReady = ready && appReady;
          const title = failed ? "离线更新未完成" : fullyReady ? "离线新版已准备好" : "正在增量更新离线词库";
          const status = failed
            ? (progressState.message || "保留当前可用版本，联网后会自动重试")
            : fullyReady
              ? "全部资源已缓存，之后无需联网"
              : ready
                ? "离线资源已缓存，正在打开词库"
              : progressState.asset
                ? `正在缓存 ${progressState.asset} · ${progressState.completed || 0}/${progressState.total || 0}`
                : "正在建立离线缓存";
          if (bootTitle) bootTitle.textContent = title;
          if (bootStatus) bootStatus.textContent = status;
          if (bootFill) bootFill.style.width = `${Math.max(3, percent)}%`;
          bootTrack?.setAttribute("aria-valuenow", String(percent));
          if (updateTitle) updateTitle.textContent = title;
          if (updateOutput) updateOutput.textContent = `${percent}%`;
          if (updateFill) updateFill.style.width = `${percent}%`;
          updateTrack?.setAttribute("aria-valuenow", String(percent));
          if (updateStatus) updateStatus.textContent = status;
          if (fullyReady || failed) {
            clearTimeout(hideProgressTimer);
            hideProgressTimer = window.setTimeout(() => {
              document.documentElement.classList.remove("offline-cache-active");
            }, failed ? 4200 : 1400);
          }
        };

        const setProgress = (state) => {
          progressState = state;
          paintProgress();
        };
        document.addEventListener("DOMContentLoaded", paintProgress, { once: true });
        navigator.serviceWorker.addEventListener("message", (event) => {
          if (!["CACHE_START", "CACHE_PROGRESS", "CACHE_READY", "CACHE_ERROR"].includes(event.data?.type)) return;
          if (event.data.type === "CACHE_READY") {
            cacheReady = true;
            const completedBuild = String(event.data.build || build);
            try { localStorage.setItem(`vocab-offline-ready-${completedBuild}`, "1"); } catch {}
            if (event.data.silent) return;
          }
          setProgress(event.data);
        });
        window.addEventListener("vocab-app-ready", () => {
          appReady = true;
          if (cacheReady && progressState) {
            setProgress({ ...progressState, type: "CACHE_READY", percent: 100 });
          }
        }, { once: true });

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController || refreshing) return;
          refreshing = true;
          window.setTimeout(() => location.reload(), 240);
        });

        const checkForUpdate = () => {
          const now = Date.now();
          if (now - lastUpdateCheck < 30_000) return;
          lastUpdateCheck = now;
          const registration = window.__vocabServiceWorkerRegistration;
          if (registration) registration.update().catch(() => {});
        };
        window.__vocabCheckForUpdates = checkForUpdate;

        const registerOfflineApp = () => {
          if (registrationStarted) return;
          registrationStarted = true;
          navigator.serviceWorker.register(`./sw.js?v=${build}`, { updateViaCache: "none" })
            .then((registration) => {
              window.__vocabServiceWorkerRegistration = registration;
              registration.update().catch(() => {});
              if (registration.waiting) {
                cacheReady = true;
                setProgress({ type: "CACHE_READY", percent: 100, message: "离线新版已准备好" });
                registration.waiting.postMessage({ type: "GET_CACHE_STATUS", silentIfReady: false });
                registration.waiting.postMessage({ type: "SKIP_WAITING" });
              }
              registration.addEventListener("updatefound", () => {
                const worker = registration.installing;
                if (!worker) return;
                setProgress({ type: "CACHE_START", percent: 1, completed: 0, total: 15 });
                worker.addEventListener("statechange", () => {
                  if (worker.state === "installed" && navigator.serviceWorker.controller) {
                    worker.postMessage({ type: "SKIP_WAITING" });
                  }
                  if (worker.state === "redundant") {
                    setProgress({
                      type: "CACHE_ERROR",
                      percent: 0,
                      message: "新版安装未完成，当前离线版本仍可继续使用",
                    });
                  }
                });
                worker.addEventListener("error", () => {
                  setProgress({
                    type: "CACHE_ERROR",
                    percent: 0,
                    message: "新版下载失败，当前离线版本仍可继续使用",
                  });
                });
              });
              let offlineReady = false;
              try { offlineReady = localStorage.getItem(offlineReadyKey) === "1"; } catch {}
              if (registration.active) {
                registration.active.postMessage({ type: "GET_CACHE_STATUS", silentIfReady: offlineReady });
              }
            })
            .catch(() => {});
        };

        // The shell is already visible when this event fires; start the
        // incremental update immediately so opening the app is enough.
        window.addEventListener("vocab-app-ready", registerOfflineApp, { once: true });
        window.addEventListener("load", registerOfflineApp, { once: true });

        const scheduleUpdateCheck = () => {
          window.setTimeout(checkForUpdate, 0);
        };
        window.addEventListener("load", scheduleUpdateCheck, { once: true });
        window.addEventListener("online", scheduleUpdateCheck);
        window.setInterval(checkForUpdate, 5 * 60_000);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") scheduleUpdateCheck();
        });
      })();
    </script>
