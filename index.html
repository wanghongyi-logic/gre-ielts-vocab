<!doctype html>
<html lang="zh-CN" class="app-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b5be6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="词汇精学" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="再要你命3000全库3071词与雅思必背词538内容精学：多重记忆、近义和形近辨析、双语例句、复习清单、五词故事与随机加权测试。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192-v2.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v2.png" />
    <link rel="apple-touch-startup-image" href="./apple-launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="./apple-launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="./apple-launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      html.app-booting body { margin: 0; overflow: hidden; background: #0d123d; }
      html.app-booting body > :not(.app-boot-screen) { visibility: hidden !important; }
      .app-boot-screen { position: fixed; z-index: 9999; inset: 0; display: grid; place-content: center; gap: 18px; padding: 24px; background: radial-gradient(circle at 50% 36%, #243f92 0, #141e61 40%, #0b1038 100%); color: #f8f7f2; text-align: center; transition: opacity .22s ease, visibility .22s ease; }
      .app-boot-mark { display: block; width: 72px; height: 72px; margin: 0 auto; overflow: hidden; border-radius: 21px; background: #11194c url("./icon-192-v2.png") center/cover no-repeat; box-shadow: 0 18px 42px rgba(29, 47, 137, .3); color: transparent; font-size: 0; }
      .app-boot-screen strong { font: 750 18px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .app-boot-screen span:last-child { color: #aebce8; font: 500 12px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      .app-boot-pulse { width: 36px; height: 4px; margin: -6px auto 0; overflow: hidden; border-radius: 999px; background: rgba(172,190,244,.22); }
      .app-boot-pulse::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #74d7ff; animation: boot-slide 1s ease-in-out infinite alternate; }
      html:not(.app-booting) .app-boot-screen { visibility: hidden; opacity: 0; pointer-events: none; }
      @keyframes boot-slide { to { transform: translateX(122%); } }
    </style>
    <link rel="modulepreload" href="./app.js?v=60" />
    <link rel="stylesheet" href="./theme-v2.css?v=60" />
    <link rel="stylesheet" href="./learning-test-v4.css?v=31" />
    <link rel="stylesheet" href="./ielts-preview.css?v=41" />
    <link rel="stylesheet" href="./review-integration.css?v=50" />
    <link rel="stylesheet" href="./mobile-v2.css?v=60" />
    <title>GRE & IELTS 词汇精学</title>
  </head>
  <body>
    <div class="app-boot-screen" role="status" aria-live="polite">
      <span class="app-boot-mark" aria-hidden="true">G</span>
      <strong>正在准备完整词库</strong>
      <span class="app-boot-pulse" aria-hidden="true"></span>
      <span>首次载入后即可离线使用</span>
    </div>
    <a class="skip-link" href="#main-content">跳到正文</a>

    <header class="app-header">
      <div class="header-inner">
        <div class="brand-picker">
          <button class="brand" type="button" data-action="go-home" aria-label="返回当前词库首页">
            <span id="brand-mark" class="brand-mark" aria-hidden="true">G</span>
            <span>
              <strong id="brand-title">GRE 词汇精学</strong>
              <small id="brand-subtitle">再要你命 3000 · 3071 词</small>
            </span>
          </button>
          <button class="corpus-switch-button" type="button" data-action="switch-corpus" aria-label="切换 GRE 与 IELTS 词库" title="切换词库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3"/></svg>
          </button>
        </div>

        <form class="header-search" data-submit="global-search" role="search">
          <input id="global-search" name="query" type="search" autocomplete="off" placeholder="搜索单词、中文释义或注解词" aria-label="搜索全部词库" />
          <button type="submit" aria-label="提交搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
        </form>

        <div class="header-actions">
          <div class="header-progress" aria-label="学习完成度">
            <span id="progress-label">0 / 300</span>
            <span class="progress-track"><span id="progress-fill"></span></span>
          </div>
          <button id="install-button" class="icon-button is-hidden" type="button" aria-label="安装到主屏幕" title="安装到主屏幕">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 16v3h14v-3" /></svg>
          </button>
          <button class="header-utility" type="button" data-action="show-notifications" aria-label="通知" title="通知">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8M9.7 20h4.6" /></svg>
          </button>
          <button id="layout-mode-button" class="layout-mode-button" type="button" data-action="toggle-rails" aria-label="收起左右边栏，进入专注模式" aria-pressed="false" title="专注模式">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-4 4 4 4M5 9h6M15 5l4 4-4 4M19 9h-6M8 19h8" /></svg>
            <span>专注模式</span>
          </button>
          <button class="header-profile" type="button" data-action="show-profile" aria-label="学习数据" title="学习数据">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0" /></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="app-layout">
      <aside class="lesson-rail" aria-label="当前学习路径">
        <nav id="lesson-list" class="lesson-list"></nav>
      </aside>

      <main id="main-content" tabindex="-1">
        <div id="app" aria-live="polite"></div>
      </main>

      <aside id="context-rail" class="context-rail" aria-label="学习状态和快捷操作"></aside>
    </div>

    <nav class="bottom-nav" aria-label="主要页面">
      <button type="button" data-route="learn" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" /></svg>
        <span>学习</span>
      </button>
      <button type="button" data-route="library" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4V4Zm16 0h-6a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h6V4Z" /></svg>
        <span>词库</span>
      </button>
      <button type="button" data-route="review" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 12V7m0 5h5M12 8v5l3 2" /></svg>
        <span>复习</span>
      </button>
    </nav>

    <nav id="mobile-command-menu" class="mobile-command-menu" aria-label="移动端快捷导航" aria-hidden="true">
      <button type="button" data-route="learn"><span>01</span><strong>学习</strong></button>
      <button type="button" data-route="library"><span>02</span><strong>词库</strong></button>
      <button type="button" data-route="review"><span>03</span><strong>复习</strong></button>
      <button type="button" data-action="switch-corpus"><span>↔</span><strong>切换词库</strong></button>
    </nav>
    <button id="mobile-immersive-button" class="mobile-immersive-button" type="button" data-action="toggle-mobile-menu" aria-label="打开快捷导航" aria-expanded="false" aria-controls="mobile-command-menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
      <span>导航</span>
    </button>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js?v=60"></script>
  </body>
</html>
