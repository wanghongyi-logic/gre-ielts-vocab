<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="title desc"><title id="title">abnegate · 图像助记</title><desc id="desc">奖杯已经标着mine，一只手却把本可属于自己的奖品推回去。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#c7954b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="360" height="200" rx="16" fill="#f6f5f1"/><rect x="34" y="75" width="108" height="87" rx="9" fill="#dce9df" stroke="#173d36" stroke-width="2"/><path d="M66 91H109L103 115Q88 134 73 115Z" fill="#c7954b" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M66 96H54Q52 114 71 116M108 96H120Q122 114 103 116M88 127V142M72 145H104" fill="none" stroke="#c7954b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="88" y="63" fill="#173d36" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">mine</text><path d="M319 93L270 90 241 104 225 99Q216 98 214 104Q214 111 231 116L249 125 281 113 319 120Z" fill="#f6f5f1" stroke="#173d36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M202 139L161 139" fill="none" stroke="#c7954b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="250" y="163" fill="#173d36" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">no, thank you</text><text x="180" y="32" fill="#173d36" font-family="Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle">abnegate</text></svg>